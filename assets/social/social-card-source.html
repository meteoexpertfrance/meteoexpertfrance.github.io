<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Visuel social MétéoClair</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      padding: 72px 96px;
      color: #f8fbff;
      background:
        radial-gradient(circle at 82% 18%, rgba(255, 122, 50, .22), transparent 330px),
        radial-gradient(circle at 8% 90%, rgba(72, 200, 240, .18), transparent 430px),
        linear-gradient(145deg, #020711, #07182b);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    }
    .eyebrow {
      margin: 0 0 20px;
      color: #7edfff;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      max-width: 650px;
      font-size: 78px;
      line-height: .98;
      letter-spacing: -.055em;
    }
    p {
      margin: 32px 0 0;
      color: #b9c6d8;
      font-size: 27px;
      font-weight: 650;
    }
    .visual {
      position: relative;
      display: grid;
      place-items: center;
    }
    .visual::before {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      border: 1px solid rgba(111, 213, 247, .28);
      border-radius: 50%;
      background: rgba(72, 200, 240, .06);
    }
    img {
      position: relative;
      width: 330px;
      height: 330px;
      border-radius: 74px;
      box-shadow: 0 36px 76px rgba(0, 0, 0, .58);
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Application météo pour iPhone</p>
    <h1>La météo,<br>clairement.</h1>
    <p>Gratuit · Sans compte · Sans publicité</p>
  </main>
  <div class="visual">
    <img src="../app-icon.png" width="1024" height="1024" alt="">
  </div>
</body>
</html>
